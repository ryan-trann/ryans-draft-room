name: Refresh NBA injury statuses

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-injuries.mjs'
      - '.github/workflows/update-injuries.yml'

permissions:
  contents: write

concurrency:
  group: injury-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download and validate current NBA injuries
        run: node scripts/update-injuries.mjs
      - name: Publish injury snapshot
        run: |
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add injuries.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NBA injury availability snapshot"
            git push
          fi
