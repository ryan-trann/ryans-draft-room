name: Refresh NBA schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "25 11 * * *"
  push:
    paths:
      - "scripts/refresh_nba_schedule.py"
      - ".github/workflows/refresh-nba-schedule.yml"

permissions:
  contents: write

concurrency:
  group: nba-schedule-refresh
  cancel-in-progress: false

jobs:
  refresh-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Fetch official NBA schedule
        run: python3 scripts/refresh_nba_schedule.py
      - name: Commit schedule only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add nba-schedule.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public NBA regular-season schedule"
            git push
          fi
