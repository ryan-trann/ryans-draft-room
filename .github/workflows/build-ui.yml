name: Build and verify purple app

on:
  push:
    paths:
      - "frontend/**"
      - "modern-bridge.js"
      - "team-editor.js"
      - "analysis-tools.js"
      - "index.source.html"
      - "scripts/prepare-production.mjs"
      - "scripts/test-production.mjs"
      - "scripts/test-injuries.mjs"
      - ".github/workflows/build-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purple-app-build
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck and build production bundle
        run: npm run build
      - name: Verify NBA injury player matching
        run: node scripts/test-injuries.mjs
      - name: Install browser for regression tests
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Run production regression suite
        run: npm run test:production
      - name: Package only verified public build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-site
          path: |
            dist/index.html
            dist/team-editor.js
            dist/modern-bridge.js
            dist/analysis-tools.js
            dist/assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Download verified site bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-site
          path: verified-site
      - name: Publish without running project code or dependencies
        run: |
          git pull --ff-only origin main
          test -s verified-site/index.html
          test -d verified-site/assets
          cp verified-site/index.html index.html
          cp verified-site/team-editor.js team-editor.js
          cp verified-site/modern-bridge.js modern-bridge.js
          cp verified-site/analysis-tools.js analysis-tools.js
          mkdir -p assets
          cp -R verified-site/assets/. assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ team-editor.js modern-bridge.js analysis-tools.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified security-hardened build"
            git push
          fi
